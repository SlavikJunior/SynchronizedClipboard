[versions]
agp = "9.3.1"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.10"
composeBom = "2026.06.01"
# Kotlin Multiplatform
kotlinMultiplatform = "2.4.10"
# Navigation
nav3Router = "1.1.0"
navigation3 = "1.1.2"
# Serialization (нужна для @Serializable Route-ключей навигации)
kotlinxSerializationJson = "1.11.0"
# Ktor — последняя стабильная на Aug 2026
ktor = "3.6.0"
# Room KMP — последняя стабильная (>= 2.6.0 требование тз.txt)
room = "2.8.5"
# AndroidX SQLite — KMP-драйвер БД (BundledSQLiteDriver) для Android + iOS.
# 2.7.1 обязателен: Room 2.8.x использует новый API androidx.sqlite.driver.SqlDriver,
# тогда как в 2.6.x был androidx.sqlite.SQLiteDriver.
# Побочный эффект: с 2.7.0 публикация iosX64 прекращена — поэтому iosX64 убран из проекта.
sqlite = "2.7.1"
# Google KSP — используется ТОЛЬКО для room-compiler (Koin 4.x → compiler plugin, не KSP)
ksp = "2.3.12"
# Koin 4.x — compiler plugin (KSP deprecated, теперь Kotlin Compiler Plugin)
koin = "4.2.2"
# Koin Compiler Plugin Gradle — заменяет ksp-обработку Koin Annotations (4.x)
koinCompilerPlugin = "1.1.0"
# Coroutines
kotlinxCoroutines = "1.11.0"
# cryptography-kotlin (whyoleg) — KMP-обёртка над JCA (Android) и CryptoKit (iOS)
cryptography = "0.6.0"
# DataStore
datastore = "1.2.1" # KMP-ready version
# Security
security = "1.1.0"
# Multiplatform Settings (encrypted storage alternative)
multiplatformSettings = "1.2.0"

[libraries]
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
# Навигация: Router (arttttt/Nav3Router) + official androidx.navigation3 runtime/ui
nav3-router = { group = "io.github.arttttt.nav3router", name = "nav3router", version.ref = "nav3Router" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
# Ktor (KMP-ready)
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-client-websockets = { group = "io.ktor", name = "ktor-client-websockets", version.ref = "ktor" }
# Room KMP
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
# Компилятор Room для генерации DAO (KSP-процессор, НЕ Koin)
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# SQLite-драйвер для Room в KMP: содержит нативную библиотеку SQLite для Android и iOS
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
# Koin 4.x — compiler plugin (auto-injects koin-core + koin-core-annotations)
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin" }
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
# Аннотации Koin 4.x (@Module, @Single, @ComponentScan)
koin-annotations = { group = "io.insert-koin", name = "koin-annotations", version.ref = "koin" }
# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
# cryptography-kotlin: AES-256-GCM. Требует Kotlin >= 2.3.0 (в проекте 2.4.10).
# provider-optimal: JCA на Android, CryptoKit + CommonCrypto fallback на iOS.
cryptography-core = { group = "dev.whyoleg.cryptography", name = "cryptography-core", version.ref = "cryptography" }
cryptography-provider-optimal = { group = "dev.whyoleg.cryptography", name = "cryptography-provider-optimal", version.ref = "cryptography" }
# DataStore (KMP-ready)
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }
# Security
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security" }
# Multiplatform Settings (encrypted storage for KMP)
multiplatform-settings = { group = "com.russhwolf", name = "multiplatform-settings", version.ref = "multiplatformSettings" }
multiplatform-settings-coroutines = { group = "com.russhwolf", name = "multiplatform-settings-coroutines", version.ref = "multiplatformSettings" }
multiplatform-settings-serialization = { group = "com.russhwolf", name = "multiplatform-settings-serialization", version.ref = "multiplatformSettings" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlinMultiplatform" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Google KSP — используется ТОЛЬКО для room-compiler (Koin 4.x → compiler plugin, не KSP)
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Room Gradle Plugin — регистрирует KSP-конфигурации Room и schema location для KMP
androidx-room = { id = "androidx.room", version.ref = "room" }
# Koin Compiler Plugin — заменяет ksp-обработку Koin Annotations (4.x)
koin-compiler = { id = "io.insert-koin.koin-compiler", version.ref = "koinCompilerPlugin" }
syncclip-android-application = { id = "com.github.slavikjunior.synchronizedclipboard.android.application" }
syncclip-android-library = { id = "com.github.slavikjunior.synchronizedclipboard.android.library" }
syncclip-android-compose = { id = "com.github.slavikjunior.synchronizedclipboard.android.compose" }
syncclip-android-feature = { id = "com.github.slavikjunior.synchronizedclipboard.android.feature" }
syncclip-koin = { id = "com.github.slavikjunior.synchronizedclipboard.koin" }
